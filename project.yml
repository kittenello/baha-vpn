name: BahaVPN
options:
  bundleIdPrefix: com.kittenello
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.kittenello.bahavpn
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  BahaCore:
    path: Core
  SwiftyXrayKit:
    path: ThirdParty/SwiftyXrayKit
targets:
  BahaVPN:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: BahaCore
      - target: PacketTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kittenello.bahavpn
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Configuration/App-Info.plist
      properties:
        CFBundleDisplayName: baha vpn
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: камера нужна для импорта qr-кода сервера или подписки
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: com.kittenello.bahavpn.import
            CFBundleURLSchemes: [vless, vmess]
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: true
    entitlements:
      path: Configuration/App.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources: [Tunnel]
    dependencies:
      - package: SwiftyXrayKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kittenello.bahavpn.tunnel
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Configuration/Tunnel-Info.plist
      properties:
        CFBundleDisplayName: baha tunnel
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
    entitlements:
      path: Configuration/Tunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
schemes:
  BahaVPN:
    build:
      targets:
        BahaVPN: all
    run:
      config: Debug
    archive:
      config: Release
