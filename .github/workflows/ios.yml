name: ios prototype
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: test parser, configuration and persistence models
        working-directory: Core
        env:
          BAHA_FIXTURES: ${{ github.workspace }}/build/fixtures
        run: swift test
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/cache@v4
        with:
          path: Native/XrayNative.xcframework
          key: full-xray-${{ runner.os }}-${{ hashFiles('Native/go.mod', 'Native/main.go', 'Native/engine/engine.go', 'scripts/build_native.py') }}
      - name: fetch verified routing geo assets
        run: python3 scripts/fetch_geo.py
      - name: validate configurations and build full native xray
        run: python3 scripts/build_native.py
      - name: install xcodegen
        run: brew install xcodegen
      - name: generate project
        run: xcodegen generate
      - name: build unsigned iphone app and tunnel
        run: |
          set -o pipefail
          xcodebuild -project BahaVPN.xcodeproj -scheme BahaVPN \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO \
            build | tee device-build.log
      - name: package unsigned ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/BahaVPN.app build/ipa/Payload/
          cd build/ipa
          zip -q -r ../baha-vpn-unsigned.ipa Payload
      - name: build simulator app
        run: |
          set -o pipefail
          xcodebuild -project BahaVPN.xcodeproj -scheme BahaVPN \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            build | tee simulator-build.log
      - name: test import persistence, launch simulator and capture preview
        run: python3 scripts/simulator_preview.py
      - name: upload unsigned ipa and simulator preview
        uses: actions/upload-artifact@v4
        with:
          name: baha-vpn-prototype
          path: |
            build/baha-vpn-unsigned.ipa
            build/preview.png
            build/ui-tests.xcresult
            build/simulator/Build/Products/Debug-iphonesimulator/BahaVPN.app
          retention-days: 14
      - name: upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: '*-build.log'
          if-no-files-found: ignore
