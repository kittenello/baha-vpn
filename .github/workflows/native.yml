name: full xray core
on:
  push:
    branches: [main]
    paths: [Native/**, scripts/build_native.py, .github/workflows/native.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: python3 scripts/build_native.py
      - uses: actions/upload-artifact@v4
        with:
          name: full-xray-native
          path: |
            Native/XrayNative.xcframework
            Native/go.sum
          retention-days: 14
